<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell My Stuff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="container">
      <section class="hero-card">
        <p class="eyebrow"><i data-lucide="shield"></i> Private Convo + XMTP Flow</p>
        <h1>Sell your stuff in a private channel</h1>
        <p class="subtext">Fill in your item details. Click once. Scan QR. Continue in a private convo thread created just for this interaction.</p>

        <form id="intakeForm" class="intake-form">
          <div class="form-row">
            <label for="itemName">Item</label>
            <input id="itemName" type="text" placeholder="e.g. iPhone 14 Pro 256GB" required />
          </div>
          <div class="form-row">
            <label for="condition">Condition</label>
            <select id="condition">
              <option value="new">New</option>
              <option value="like new">Like New</option>
              <option value="used" selected>Used</option>
              <option value="fair">Fair</option>
              <option value="for parts">For Parts</option>
            </select>
          </div>
          <div class="form-row two-col">
            <div>
              <label for="targetPrice">Asking Price ($)</label>
              <input id="targetPrice" type="number" min="1" step="0.01" placeholder="500" required />
            </div>
            <div>
              <label for="floorPrice">Minimum Price ($)</label>
              <input id="floorPrice" type="number" min="1" step="0.01" placeholder="350" required />
            </div>
          </div>
          <div class="form-row">
            <label for="deadline">Sale Deadline</label>
            <input id="deadline" type="datetime-local" required />
          </div>
        </form>

        <div class="actions">
          <button id="sellBtn" class="primary-btn" type="submit" form="intakeForm">
            <i data-lucide="tag"></i>
            Sell my stuff
          </button>
          <button id="resetBtn" class="ghost-btn" hidden>Start a new private interaction</button>
        </div>

        <div id="status" class="status">Ready.</div>
      </section>

      <section id="qrPanel" class="qr-card" hidden>
        <h2><i data-lucide="qr-code"></i> Scan to open private Convo channel</h2>
        <img id="qrImage" alt="Convo invite QR code" />
        <div class="meta-grid">
          <div><span>Interaction</span><code id="interactionId">-</code></div>
          <div><span>Channel</span><code id="channelId">-</code></div>
          <div><span>Expires</span><code id="expiresAt">-</code></div>
        </div>
      </section>
    </main>

    <script src="/main.js" type="module"></script>
  </body>
</html>
